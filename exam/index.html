<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 훈련</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
  :root{
    --desk:#E9E5DB; --paper:#FCFBF8; --ink:#22201C; --muted:#8C8677;
    --teal:#22635C; --teal-soft:#E4EEEC; --teal-line:#BFD8D4;
    --cover:#D8384A; --cover-2:#C42F41; --ok:#2E7D57;
    --line:#E8E3D8;
    --eng:'Space Grotesk', ui-monospace, system-ui, sans-serif;
    --kor:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --shadow:0 1px 0 rgba(0,0,0,.02), 0 8px 24px -18px rgba(34,32,28,.35);
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--desk);
    background-image:radial-gradient(circle at 1px 1px, rgba(34,32,28,.05) 1px, transparent 0);
    background-size:22px 22px; color:var(--ink); font-family:var(--kor);
    -webkit-font-smoothing:antialiased; line-height:1.5; padding:40px 16px 80px;
    touch-action:manipulation;}   /* 더블탭 확대만 끈다. 손가락 두 개로 벌리는 확대는 그대로 */
  .wrap{max-width:720px;margin:0 auto}

  header{margin:8px 4px 26px}
  .eyebrow{font-family:var(--eng);font-weight:600;letter-spacing:.28em;text-transform:uppercase;
    font-size:11px;color:var(--teal)}
  h1{font-family:var(--eng);font-weight:700;font-size:clamp(38px,9vw,62px);letter-spacing:-.02em;
    margin:.12em 0 .08em;line-height:.98}
  h1 .no{color:var(--cover)}
  .sub{color:var(--muted);font-size:14.5px}

  .menu{display:flex;flex-direction:column;gap:12px}

  .corner{display:block;text-decoration:none;color:inherit;background:var(--paper);
    border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px 24px;
    -webkit-tap-highlight-color:transparent;
    transition:border-color .15s ease, transform .07s ease, box-shadow .15s ease}
  .corner:hover{border-color:var(--teal-line);box-shadow:0 1px 0 rgba(0,0,0,.02), 0 14px 30px -20px rgba(34,32,28,.5)}
  .corner:active{transform:translateY(1px)}
  .ctop{display:flex;align-items:center;gap:12px}
  .cname{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .ceng{font-family:var(--eng);font-size:11.5px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--teal);background:var(--teal-soft);
    border-radius:8px;padding:4px 9px}
  .carrow{margin-left:auto;font-family:var(--eng);font-weight:700;font-size:20px;color:var(--teal-line)}
  .corner:hover .carrow{color:var(--teal)}
  .cdesc{margin:9px 0 0;font-size:14.5px;color:var(--muted);line-height:1.7}
  .cstat{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 0}
  .cstat span{font-size:13px;color:var(--muted);background:#fff;border:1px solid var(--line);
    border-radius:99px;padding:6px 12px}
  .cstat b{font-family:var(--eng);color:var(--teal);font-weight:700}

  .soon{background:none;border:1px dashed var(--teal-line);box-shadow:none;cursor:default;
    padding:24px;text-align:center}
  .soon .t{font-weight:600;font-size:15px;color:var(--muted)}
  .soon .d{margin:7px 0 0;font-size:13.5px;color:var(--muted);line-height:1.7}

  .note{font-size:12.5px;color:var(--muted);margin:26px 6px 0;line-height:1.7}

  @media (max-width:600px){
    body{padding:28px 12px 70px}
    .corner{padding:18px}
    .cname{font-size:18px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">영어 훈련</div>
    <h1>Training<span class="no">.</span></h1>
    <div class="sub">하고 싶은 훈련을 고르세요.</div>
  </header>

  <div class="menu">
    <a class="corner" href="reading.html">
      <div class="ctop">
        <span class="cname">독해 훈련</span>
        <span class="ceng">Reading</span>
        <span class="carrow">→</span>
      </div>
      <p class="cdesc">지문 하나를 읽고 문제를 풉니다. 채점과 해설이 나오고, 걸린 시간으로 처리 속도를 재서 지난 기록과 견줘 봅니다.</p>
      <div class="cstat" id="readingStat"></div>
    </a>

    <div class="corner soon">
      <div class="t">다음 코너는 여기에</div>
      <p class="d">실전에 도움이 되는 훈련을 하나씩 더해 갈 자리입니다.</p>
    </div>
  </div>

  <p class="note">
    기록은 이 브라우저와 웹(기기 간 동기화) 양쪽에 저장됩니다.
    저장 위치는 각 훈련 페이지에서 바꿀 수 있어요.
  </p>
</div>

<script src="data/h1.js"></script>
<script src="data/h2.js"></script>
<script src="data/sn.js"></script>
<script>
(function(){
  'use strict';
  /* 요약만 보여 주므로 Firestore를 기다리지 않고 이 기기 기록을 읽는다.
     독해 페이지가 어느 모드에서든 localStorage에 함께 남기기 때문에 값은 최신이다. */
  var LEVELS = [
    { key:'h1', label:'고1', bank: typeof EXAM_SETS_H1 !== 'undefined' ? EXAM_SETS_H1 : [] },
    { key:'h2', label:'고2', bank: typeof EXAM_SETS_H2 !== 'undefined' ? EXAM_SETS_H2 : [] },
    { key:'sn', label:'수능', bank: typeof EXAM_SETS_SN !== 'undefined' ? EXAM_SETS_SN : [] }
  ];
  var state = {};
  try { state = JSON.parse(localStorage.getItem('exam_progress')) || {}; } catch(e) { state = {}; }

  function words(set){ return set.passage.trim().split(/\s+/).length; }

  var totalSets = 0, doneCount = 0, speeds = [];
  LEVELS.forEach(function(lv){
    totalSets += lv.bank.length;
    var done = (state[lv.key] && state[lv.key].done) || {};
    lv.bank.forEach(function(set){
      var rec = done[set.id];
      if(!rec) return;
      doneCount++;
      if(!(rec.sec > 0)) return;
      var v = words(set) / (rec.sec / 60);
      if(v <= 400) speeds.push({ at: rec.at || 0, v: v });   /* 찍고 바로 제출한 기록은 제외 */
    });
  });

  var box = document.getElementById('readingStat');
  function chip(label, value){
    var s = document.createElement('span');
    s.appendChild(document.createTextNode(label + ' '));
    var b = document.createElement('b');
    b.textContent = value;
    s.appendChild(b);
    box.appendChild(s);
  }
  chip('지문', doneCount + ' / ' + totalSets);
  if(speeds.length){
    speeds.sort(function(a, b){ return b.at - a.at; });
    var recent = speeds.slice(0, 5);
    var avg = Math.round(recent.reduce(function(a, r){ return a + r.v; }, 0) / recent.length);
    chip('최근 처리 속도', avg + ' words/분');
  } else {
    var s = document.createElement('span');
    s.textContent = '아직 푼 기록이 없어요';
    box.appendChild(s);
  }
})();
</script>
</body>
</html>
